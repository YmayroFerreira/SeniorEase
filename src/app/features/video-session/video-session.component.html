<div
  class="video-placeholder"
  [ngClass]="{ 'high-contrast': accessibility.theme() === 'high-contrast' }"
  [appVoiceRead]="'VIDEO_SESSION.VIDEO_AREA' | translate"
>
  <div class="video-overlay">
    <span class="status-badge" [appVoiceRead]="'VIDEO_SESSION.LIVE_BADGE' | translate"
      >● {{ 'VIDEO_SESSION.LIVE_BADGE' | translate }}</span
    >

    <i class="camera-icon" aria-hidden="true">🎥</i>
  </div>

  <p class="placeholder-text">{{ 'VIDEO_SESSION.PLACEHOLDER' | translate }}</p>
</div>
