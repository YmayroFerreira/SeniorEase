<section class="dashboard-ds" aria-label="Painel principal do aluno">
  <!-- ───── Header ───── -->
  <ui-header title="Início" subtitle="Olá, Sr. Arnaldo" badgeLabel="Dashboard DS"></ui-header>

  <!-- ───── Hero Card — Aula de Hoje ───── -->
  <ui-hero-card
    eyebrow="Aula de Hoje"
    title="Desenvolvimento Front End"
    description="19:00 – 21:00 • Sala virtual 03 • Prof. Dr. Carlos Mendes"
    primaryActionLabel="Entrar na sala de aula"
    highlightLabel="A aula começa em"
    highlightValue="15 min"
  ></ui-hero-card>

  <!-- ───── Stats Grid — Progresso ───── -->
  <section aria-label="Meu progresso no curso">
    <ui-text element="h2" size="lg" weight="semibold">Meu Progresso</ui-text>

    <div class="dashboard-ds__stats-wrapper">
      <ui-stats-grid [items]="stats"></ui-stats-grid>
    </div>

    <!-- Progress bar -->
    <div
      class="dashboard-ds__progress"
      role="progressbar"
      aria-valuenow="40"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-label="Progresso do curso: 40 porcento concluído"
    >
      <div class="dashboard-ds__progress-track">
        <div class="dashboard-ds__progress-fill" style="width: 40%"></div>
      </div>
      <div class="dashboard-ds__progress-labels">
        <ui-text element="span" size="sm" tone="muted">
          <ui-icon name="check" aria-hidden="true"></ui-icon>
          3 Aulas Concluídas
        </ui-text>
        <ui-badge variant="success" label="QUASE NA METADE!"></ui-badge>
        <ui-text element="span" size="sm" tone="muted">6 Aulas Restantes</ui-text>
      </div>
    </div>
  </section>

  <!-- ───── Grid: Agenda + Materiais ───── -->
  <div class="dashboard-ds__grid">
    <ui-agenda-list title="Agenda do Dia" [items]="agendaItems"></ui-agenda-list>

    <ui-materials-list title="Materiais e Atalhos" [items]="materialsItems"></ui-materials-list>
  </div>

  <!-- ───── Entrega confirmada ───── -->
  <section class="dashboard-ds__delivery" aria-label="Status do trabalho final">
    <div class="dashboard-ds__delivery-card">
      <span class="dashboard-ds__delivery-icon">
        <ui-icon name="check" aria-hidden="true"></ui-icon>
      </span>
      <div class="dashboard-ds__delivery-copy">
        <ui-text element="span" weight="semibold">Trabalho Final</ui-text>
        <ui-text element="span" size="sm" tone="muted">✓ Entregue com sucesso</ui-text>
      </div>
      <ui-badge variant="success" label="Concluído"></ui-badge>
    </div>
  </section>
</section>
