<div class="flex flex-col h-screen bg-surface">
  <header class="bg-primary px-6 py-3 flex items-center gap-4 shadow-md">
    <button
      (click)="goBack()"
      [appVoiceRead]="
        fromWizard ? ('FORUM.BACK_ACTIVITIES' | translate) : ('FORUM.BACK_HOME' | translate)
      "
      class="text-white text-xl p-2 flex-shrink-0 cursor-pointer bg-transparent border-none"
    >
      <ui-icon [icon]="icons.back"></ui-icon>
    </button>
    <div class="flex-1 min-w-0">
      @if (!accessibility.simplifiedNav()) {
        <app-breadcrumb
          class="mb-0.5 block"
          variant="dark"
          [items]="
            fromWizard
              ? [
                  { label: ('NAV.HOME' | translate), route: '/inicio' },
                  { label: ('ACTIVITY.TITLE' | translate), route: '/minhas-atividades' },
                  { label: ('FORUM.TITLE' | translate) },
                ]
              : [
                  { label: ('NAV.HOME' | translate), route: '/inicio' },
                  { label: ('FORUM.TITLE' | translate) },
                ]
          "
        ></app-breadcrumb>
      } @else {
        <p class="text-primary-light text-xs">{{ 'FORUM.GROUP_DESC' | translate }}</p>
      }
      <h1 class="text-white font-bold text-base leading-snug truncate">Fórum: Hackathon</h1>
    </div>
  </header>

  <div class="flex-1 overflow-y-auto p-6 space-y-4">
    <div
      *ngFor="let msg of messages"
      [ngClass]="msg.isMe ? 'flex flex-col items-end' : 'flex flex-col items-start'"
    >
      <span
        class="text-xs font-bold mb-1 px-2"
        [ngClass]="msg.isProfessor ? 'text-primary' : 'text-muted'"
      >
        {{ msg.sender }} {{ msg.isProfessor ? '• ' + ('FORUM.TEACHER_ROLE' | translate) : '' }}
      </span>

      <div
        class="max-w-[85%] p-4 rounded-2xl shadow-sm text-lg"
        [ngClass]="{
          'bg-primary text-white rounded-tr-none': msg.isMe,
          'bg-card text-foreground border border-border rounded-tl-none': !msg.isMe,
          'border-2 border-primary-light bg-black text-primary-light':
            accessibility.theme() === 'high-contrast',
        }"
        [appVoiceRead]="msg.sender + ' ' + ('FORUM.SAID' | translate) + ': ' + msg.text"
      >
        {{ msg.text }}
        <p class="text-[10px] mt-2 opacity-70 text-right">{{ msg.time }}</p>
      </div>
    </div>
  </div>

  <footer class="p-4 bg-card border-t border-border">
    <div class="flex items-center gap-3">
      <input
        type="text"
        [(ngModel)]="newMessage"
        class="flex-1 bg-surface border-2 border-border rounded-full px-5 py-3 text-lg focus:outline-none focus:border-primary"
        [placeholder]="'FORUM.INPUT_PLACEHOLDER' | translate"
      />

      <app-voice-input-btn (result)="newMessage = $event" class="flex-shrink-0" />

      <button
        (click)="sendMessage()"
        class="w-14 h-14 bg-primary text-white rounded-full flex items-center justify-center shadow-lg active:scale-95"
      >
        <ui-icon [icon]="icons.send" class="text-xl"></ui-icon>
      </button>
    </div>
  </footer>
</div>
